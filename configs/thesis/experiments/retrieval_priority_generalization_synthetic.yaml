schema_version: retrieval_experiment_suite_v2
suite_id: thesis_priority_generalization_synthetic_development_v2
questions:
  manifest_path: data/thesis/eval/base_question_set_manifest.json
corpus:
  snapshot_manifest_path: data/thesis/corpus/snapshot_manifest.json
defaults:
  top_k: 20
  selection_seed: 14731
  stage_evaluation_depth: 20
  final_evaluation:
    streams:
    - items
    - context_items
    target_levels:
    - chunk
    include_in_pool: true
    compute_metrics: true
    context:
      rank_cutoffs:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 10
      - 15
      - 20
      character_budgets: []
      include_full_context: true
      compute_mixed_metrics: true
      compute_reference_anchor_diagnostics: true
experiments:
- experiment_id: global_hybrid
  system_config: configs/thesis/systems/parent_hybrid.yaml
  splits:
  - development
- experiment_id: main_nlu_topic_fallback_3
  system_config: configs/thesis/systems/main_nlu_hybrid.yaml
  splits:
  - development
  overrides:
    settings.pipeline.trace_all_candidates: true
    settings.pipeline.main_nlu_routing.mode: additive
    settings.pipeline.main_nlu_routing.candidate_union:
      priority_k: 25
    settings.pipeline.protected_priority_slots: 3
    settings.pipeline.main_nlu_routing.fallback_to_page_routing: true
    settings.pipeline.page_routing.enabled: true
    settings.pipeline.page_routing.mode: fixed_pages
    settings.pipeline.page_routing.include_global: true
    settings.pipeline.page_routing.candidate_union:
      priority_k: 25
    settings.pipeline.page_routing.descendant_depth: 3
