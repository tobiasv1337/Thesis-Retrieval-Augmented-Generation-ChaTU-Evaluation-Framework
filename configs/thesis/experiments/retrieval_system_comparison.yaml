schema_version: retrieval_experiment_suite_v2
suite_id: thesis_retrieval_system_comparison_top15_development

questions:
  manifest_path: data/thesis/eval/base_question_set_manifest.json

corpus:
  snapshot_manifest_path: data/thesis/corpus/snapshot_manifest.json

defaults:
  top_k: 15
  stage_evaluation_depth: 20
  selection_seed: 14731
  final_evaluation:
    streams: [items, context_items]
    target_levels: [page, chunk]
    include_in_pool: true
    compute_metrics: true
    context:
      rank_cutoffs: [1, 3, 5, 10, 15]
      character_budgets: [4000, 8000, 16000, 32000]
      include_full_context: true
      compute_mixed_metrics: true
      compute_reference_anchor_diagnostics: true

experiments:
  - experiment_id: legacy_refreshed_nlu
    system_config: configs/thesis/systems/legacy_refreshed_nlu.yaml
    splits: [development]

  - experiment_id: legacy_no_routing
    system_config: configs/thesis/systems/legacy_no_routing.yaml
    splits: [development]

  - experiment_id: legacy_gold_intent_diagnostic
    system_config: configs/thesis/systems/legacy_gold_intent.yaml
    splits: [development]

  - experiment_id: modern_dense
    system_config: configs/thesis/systems/modern_dense.yaml
    splits: [development]
    overrides:
      settings.pipeline.config_version: modern_pipeline_config_v3
      settings.pipeline.language_policy: query_language_complete
      settings.pipeline.context.policy_id: direct_children
      settings.pipeline.context.source_top_k: 15

  - experiment_id: modern_sparse
    system_config: configs/thesis/systems/modern_sparse.yaml
    splits: [development]
    overrides:
      settings.pipeline.config_version: modern_pipeline_config_v3
      settings.pipeline.language_policy: query_language_complete
      settings.pipeline.context.policy_id: direct_children
      settings.pipeline.context.source_top_k: 15

  - experiment_id: modern_hybrid_k10
    system_config: configs/thesis/systems/modern_hybrid.yaml
    splits: [development]
    overrides:
      settings.pipeline.config_version: modern_pipeline_config_v3
      settings.pipeline.language_policy: query_language_complete
      settings.pipeline.context.policy_id: direct_children
      settings.pipeline.context.source_top_k: 15
      settings.pipeline.content_rrf.component_id: ordinary_rrf_k10_v1
      settings.pipeline.content_rrf.rank_constant: 10

comparisons:
  - comparison_id: modern_retrieval_architecture
    experiment_ids:
      - modern_dense
      - modern_sparse
      - modern_hybrid_k10

  - comparison_id: legacy_baseline_vs_modern
    baseline_experiment_id: legacy_refreshed_nlu
    candidate_experiment_ids: [modern_hybrid_k10]

  - comparison_id: legacy_routing_ablation
    baseline_experiment_id: legacy_refreshed_nlu
    candidate_experiment_ids: [legacy_no_routing]

  - comparison_id: legacy_gold_intent_diagnostic
    baseline_experiment_id: legacy_refreshed_nlu
    candidate_experiment_ids: [legacy_gold_intent_diagnostic]
