comparisons:
  - comparison_id: signal_correct
    experiment_ids: [cross_lingual_correct, query_complete_correct, cross_lingual_dedup_correct]
  - comparison_id: signal_always_de
    experiment_ids: [cross_lingual_always_de, query_complete_always_de, cross_lingual_dedup_always_de]
  - comparison_id: signal_always_en
    experiment_ids: [cross_lingual_always_en, query_complete_always_en, cross_lingual_dedup_always_en]
  - comparison_id: signal_swapped
    experiment_ids: [cross_lingual_swapped, query_complete_swapped, cross_lingual_dedup_swapped]
  - comparison_id: signal_query_complete_robustness
    baseline_experiment_id: query_complete_correct
    candidate_experiment_ids: [query_complete_always_de, query_complete_always_en, query_complete_swapped]
  - comparison_id: signal_cross_lingual_robustness
    baseline_experiment_id: cross_lingual_correct
    candidate_experiment_ids: [cross_lingual_always_de, cross_lingual_always_en, cross_lingual_swapped]
  - comparison_id: signal_cross_lingual_dedup_robustness
    baseline_experiment_id: cross_lingual_dedup_correct
    candidate_experiment_ids: [cross_lingual_dedup_always_de, cross_lingual_dedup_always_en, cross_lingual_dedup_swapped]
