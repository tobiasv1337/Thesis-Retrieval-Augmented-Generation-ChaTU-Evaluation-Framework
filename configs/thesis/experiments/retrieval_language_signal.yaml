schema_version: retrieval_experiment_suite_v2
suite_id: thesis_retrieval_language_signal_top5_development

questions:
  manifest_path: data/thesis/eval/base_question_set_manifest.json
corpus:
  snapshot_manifest_path: data/thesis/corpus/snapshot_manifest.json
defaults:
  top_k: 5
  stage_evaluation_depth: 20
  selection_seed: 14731
  final_evaluation:
    streams: [items]
    target_levels: [page, chunk]
    include_in_pool: true
    compute_metrics: true

experiments:
  - experiment_id: query_complete_correct
    system_config: configs/thesis/systems/modern_hybrid.yaml
    splits: [development]
    overrides:
      settings.query_language_signal: correct
      settings.pipeline.config_version: modern_pipeline_config_v3
      settings.pipeline.language_policy: query_language_complete
      settings.pipeline.content_rrf.component_id: ordinary_rrf_k10_v1
      settings.pipeline.content_rrf.rank_constant: 10
      settings.pipeline.context.policy_id: direct_children
      settings.pipeline.context.source_top_k: 5
  - experiment_id: query_complete_always_de
