comparisons:
  - comparison_id: chunker_algorithm_800
    experiment_ids:
      - chunker_fixed_hybrid
      - chunker_recursive_hybrid
      - chunker_section_strict_hybrid
      - chunker_section_preferred_800_hybrid

  - comparison_id: section_preferred_length
    experiment_ids:
      - chunker_section_preferred_600_hybrid
      - chunker_section_preferred_800_hybrid
      - chunker_section_preferred_1000_hybrid
