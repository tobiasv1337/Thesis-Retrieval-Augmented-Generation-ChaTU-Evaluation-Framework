schema_version: retrieval_experiment_suite_v1
suite_id: thesis_priority_navigation_development_v4
questions:
  manifest_path: data/logs/question_sets/priority-development/manifest.json
  artifact_name: questions
corpus:
  snapshot_manifest_path: data/thesis/corpus/snapshot_manifest.json
defaults:
  top_k: 20
  selection_seed: 14731
  final_evaluation:
    streams: [items]
    target_levels: [page]
    include_in_pool: true
    compute_metrics: true
    # K saved root hits plus their descendants; old retrieval runs can be reused.
    page_scopes:
      # All real root hits remain mandatory; only additional children use cache-only evidence.
      judgment_mode: cached_only
      depths: [0, 1, 2, 3, 4, 5]
      root_cutoffs: [1, 3, 5, 10, 20]
experiments:
  - experiment_id: main_nlu
    system_config: configs/thesis/systems/main_nlu_page_ranking.yaml
    splits: [development]
  - experiment_id: backup_full
    system_config: configs/thesis/systems/backup_nlu.yaml
    splits: [development]
  - experiment_id: modern_full
    system_config: configs/thesis/systems/modern_page_ranking.yaml
    splits: [development]
    overrides:
      settings.pipeline.language_policy: cross_lingual
      settings.pipeline.counterpart_deduplication: highest_ranked_page
      settings.pipeline.content_rrf.rank_constant: 30
      settings.pipeline.content_rrf.component_id: ordinary_rrf_k30_v1
  - experiment_id: modern_nemotron_full
    system_config: configs/thesis/systems/modern_page_ranking.yaml
    splits: [development]
    overrides:
      settings.pipeline.language_policy: cross_lingual
      settings.pipeline.counterpart_deduplication: highest_ranked_page
      settings.pipeline.content_rrf.rank_constant: 30
      settings.pipeline.content_rrf.component_id: ordinary_rrf_k30_v1
      settings.pipeline.reranker.enabled: true
      settings.pipeline.reranker.component_id: private_http_nemotron_1b_v1
      settings.pipeline.reranker.profile_id: nemotron_1b
      settings.pipeline.reranker.expected_profile_hash: sha256:7fb4888d663ff34bb1403f4d1b529afc17724b6418daf15e080645eb2b77b44a
      settings.pipeline.reranker.input_format: title_heading_text_v1
  - experiment_id: page_metadata_full
    system_config: configs/thesis/systems/parent_page_ranking.yaml
    splits: [development]
    overrides:
      settings.pipeline.language_policy: cross_lingual
      settings.pipeline.content_rrf.rank_constant: 30
      settings.pipeline.content_rrf.component_id: ordinary_rrf_k30_v1
  - experiment_id: page_summary_full
    system_config: configs/thesis/systems/parent_page_ranking.yaml
    splits: [development]
    overrides:
      settings.pipeline.language_policy: cross_lingual
      settings.pipeline.content_rrf.rank_constant: 30
      settings.pipeline.content_rrf.component_id: ordinary_rrf_k30_v1
      settings.routing_manifest_path: data/thesis/routing/with_summaries/manifest.json
      settings.include_summary: true
  - experiment_id: group_metadata_full
