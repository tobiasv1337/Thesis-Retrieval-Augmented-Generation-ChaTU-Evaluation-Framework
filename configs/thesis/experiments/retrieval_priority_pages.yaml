  - comparison_id: restricted_corpus
    baseline_experiment_id: main_nlu
    candidate_experiment_ids: [backup_restricted, modern_restricted, modern_nemotron_restricted, page_metadata_restricted, page_summary_restricted, group_metadata_restricted, group_summary_restricted]
  - comparison_id: expanded_priority_retriever
    baseline_experiment_id: modern_nemotron_full
