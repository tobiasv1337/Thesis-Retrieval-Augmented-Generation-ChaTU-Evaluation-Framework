schema_version: retrieval_experiment_suite_v2
suite_id: thesis_priority_downstream_development_v2
questions:
  manifest_path: data/logs/question_sets/priority-development/manifest.json
  artifact_name: questions
corpus:
  snapshot_manifest_path: data/thesis/corpus/snapshot_manifest.json
defaults:
  top_k: 20
  selection_seed: 14731
  stage_evaluation_depth: 20
  final_evaluation:
    streams: [items, context_items]
    target_levels: [page, chunk]
    include_in_pool: true
    compute_metrics: true
    context:
      rank_cutoffs: [1, 2, 3, 4, 5, 10, 15, 20]
      character_budgets: [1000, 2000, 4000, 8000, 16000, 32000]
      include_full_context: true
      compute_mixed_metrics: true
      compute_reference_anchor_diagnostics: true
experiments:
  - experiment_id: global_hybrid
    system_config: configs/thesis/systems/parent_hybrid.yaml
    splits: [development]
  - experiment_id: main_nlu_additive
    system_config: configs/thesis/systems/main_nlu_hybrid.yaml
    splits: [development]
    overrides:
      settings.pipeline.main_nlu_routing.mode: additive
      settings.pipeline.main_nlu_routing.fusion_weights: {global_weight: 2, priority_weight: 1}
  - experiment_id: fixed_topic_branch
    system_config: configs/thesis/systems/parent_hybrid.yaml
    splits: [development]
    overrides:
      settings.pipeline.page_routing.enabled: true
      settings.pipeline.page_routing.mode: fixed_pages
      settings.pipeline.page_routing.include_global: true
      settings.pipeline.page_routing.fusion_weights: {global_weight: 2, priority_weight: 1}
      settings.pipeline.page_routing.page_subset_manifest_path: data/thesis/eval/manual_page_benchmark/manifest.json
  - experiment_id: fixed_topic_only
    system_config: configs/thesis/systems/parent_hybrid.yaml
    splits: [development]
    overrides:
      settings.pipeline.page_routing.enabled: true
      settings.pipeline.page_routing.mode: fixed_pages
      settings.pipeline.page_routing.include_global: false
      settings.pipeline.page_routing.page_subset_manifest_path: data/thesis/eval/manual_page_benchmark/manifest.json
  - experiment_id: priority_page_metadata
    system_config: configs/thesis/systems/parent_hybrid.yaml
    splits: [development]
    overrides:
      settings.pipeline.page_routing.enabled: true
      settings.pipeline.page_routing.mode: page
      settings.pipeline.page_routing.top_p: 5
      settings.pipeline.page_routing.include_global: true
      settings.pipeline.page_routing.include_summary: false
      settings.pipeline.page_routing.fusion_weights: {global_weight: 2, priority_weight: 1}
      settings.pipeline.page_routing.manifest_path: data/thesis/routing/metadata_v2/manifest.json
      settings.pipeline.page_routing.page_subset_manifest_path: data/thesis/eval/manual_page_benchmark/manifest.json
  - experiment_id: priority_page_summary
    system_config: configs/thesis/systems/parent_hybrid.yaml
    splits: [development]
    overrides:
      settings.pipeline.page_routing.enabled: true
      settings.pipeline.page_routing.mode: page
      settings.pipeline.page_routing.top_p: 5
      settings.pipeline.page_routing.include_global: true
      settings.pipeline.page_routing.include_summary: true
      settings.pipeline.page_routing.fusion_weights: {global_weight: 2, priority_weight: 1}
      settings.pipeline.page_routing.manifest_path: data/thesis/routing/with_summaries/manifest.json
      settings.pipeline.page_routing.page_subset_manifest_path: data/thesis/eval/manual_page_benchmark/manifest.json
  - experiment_id: priority_group_metadata
    system_config: configs/thesis/systems/parent_hybrid.yaml
    splits: [development]
    overrides:
      settings.pipeline.page_routing.enabled: true
      settings.pipeline.page_routing.mode: group
      settings.pipeline.page_routing.top_groups: 20
      settings.pipeline.page_routing.include_global: true
      settings.pipeline.page_routing.include_summary: false
      settings.pipeline.page_routing.fusion_weights: {global_weight: 2, priority_weight: 1}
      settings.pipeline.page_routing.manifest_path: data/thesis/routing/metadata_v2/manifest.json
      settings.pipeline.page_routing.page_subset_manifest_path: data/thesis/eval/manual_page_benchmark/manifest.json
  - experiment_id: priority_group_summary
    system_config: configs/thesis/systems/parent_hybrid.yaml
    splits: [development]
    overrides:
      settings.pipeline.page_routing.enabled: true
      settings.pipeline.page_routing.mode: group
      settings.pipeline.page_routing.top_groups: 20
      settings.pipeline.page_routing.include_global: true
      settings.pipeline.page_routing.include_summary: true
      settings.pipeline.page_routing.fusion_weights: {global_weight: 2, priority_weight: 1}
      settings.pipeline.page_routing.manifest_path: data/thesis/routing/with_summaries/manifest.json
      settings.pipeline.page_routing.page_subset_manifest_path: data/thesis/eval/manual_page_benchmark/manifest.json
comparisons:
  - comparison_id: priority_routing_effect
    baseline_experiment_id: global_hybrid
    candidate_experiment_ids: [main_nlu_additive, fixed_topic_branch, fixed_topic_only, priority_page_metadata, priority_page_summary, priority_group_metadata, priority_group_summary]
  - comparison_id: global_branch_effect
    baseline_experiment_id: fixed_topic_only
    candidate_experiment_ids: [fixed_topic_branch]
  - comparison_id: page_selection_effect
    baseline_experiment_id: fixed_topic_branch
    candidate_experiment_ids: [priority_page_metadata, priority_page_summary, priority_group_metadata, priority_group_summary]
