schema_version: system_config_v2
system_id: modern_priority_hybrid
class_path: thesis_rag.retrieval.system.ModernRetrievalSystem
settings:
  snapshot_manifest_path: data/thesis/corpus/snapshot_manifest.json
  pipeline:
    representation:
      chunker_id: section_preferred_800_100
      fields: [text]
    language_policy: cross_lingual
    counterpart_deduplication: highest_ranked_page
    candidate_k: 100
    protected_priority_slots: 3
    main_nlu_priority_slots: 10
    priority_ordering: nlu_prefix_3
    dense_global:
      enabled: true
      component_id: bge_m3_fp16_dense_v1
      index_root: outputs/thesis/indexes/dense_bge_m3_fp16
      normalize: true
      model:
        backend: ollama
        endpoint: http://127.0.0.1:11434
        model_id: bge-m3:567m-fp16
        expected_model_artifact_digest: sha256:daec91ffb5dd0c27411bd71f29932917c49cf529a641d0168496c3a501e3062c
        dimensions: 1024
        batch_size: 32
        timeout_seconds: 120.0
        truncate: true
    sparse_global:
      enabled: true
      component_id: unicode_bm25_v1
      index_root: outputs/thesis/indexes/sparse_unicode_bm25
      tokenizer_id: unicode_words_v1
      k1: 1.5
      b: 0.75
      remove_stopwords: true
      cross_shard_rrf_k: 60
    content_rrf:
      enabled: true
      component_id: ordinary_rrf_k30_v1
      rank_constant: 30
    page_routing:
      enabled: true
      mode: fixed_pages
      include_global: true
      candidate_union:
        priority_k: 25
      descendant_depth: 5
      page_subset_manifest_path: data/thesis/eval/manual_page_benchmark/manifest.json
      component_id: parent_routing_v1
      top_p: 100
      top_groups: 100
    main_nlu_routing:
      enabled: true
      component_id: main_nlu_router_v1
      mode: additive
      candidate_union:
        priority_k: 25
      fallback_to_page_routing: true
      confidence_threshold: 0.99
      descendant_depth: 5
      model_manifest_path: data/thesis/rasa/model-snapshot/rasa_snapshot_manifest.json
      runtime_root: data/thesis/rasa/runtime
      conda_environment: rasa3.x
    intent_prior:
      enabled: false
      component_id: soft_intent_prior_v1
    reranker:
      enabled: true
      component_id: private_http_nemotron_1b_v1
      profile_id: nemotron_1b
      expected_profile_hash: sha256:7fb4888d663ff34bb1403f4d1b529afc17724b6418daf15e080645eb2b77b44a
      input_format: title_heading_text_v1
    context:
      enabled: false
      component_id: direct_context_v1
      policy_id: direct_children
      source_top_k: 20
      token_budget: 6000
    config_version: modern_pipeline_config_v3
