decisions:
  - policy_id: signal_correct
    selected_experiment_ids:
      - cross_lingual_dedup_correct
    rationale: >-
      Use cross-lingual retrieval with counterpart deduplication when user
      language settings are unreliable. Its quality is unchanged across all
      four signals. Query Complete has higher Page-family nDCG with correct
      signals, but lower scores under each incorrect-signal condition.
      Choosing robustness for a TU chatbot is more important here for 
      real-world performance.
