      - language_query_complete_hybrid
    rationale: >-
      I select Query-language complete because it removes duplicate bilingual
      results and still searches pages that exist only in the other language.
      It achieved the highest overall Page-family nDCG@5. The difference from
      final counterpart dedup is not statistically clear, and Cross-lingual
      achieved higher exact Chunk nDCG@5 but not Page-family nDCG@5 which is
      the more informative metric here.
